args:
  km:
    default: "v0.0.1-rc.6"
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
    description: km release
  kmSha256Arm64:
    default: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    pattern: '^[0-9a-f]{64}$'
    description: arm64 checksum
  kmSha256Amd64:
    default: "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
    pattern: '^[0-9a-f]{64}$'
    description: amd64 checksum
  cao:
    default: "2.5.4"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: CAO release
