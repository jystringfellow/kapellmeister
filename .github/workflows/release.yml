name: Release
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "bad tag: $VERSION"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require commit on main
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./...
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="km_${VERSION}_${goos}_${goarch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "build/$name/km" ./cmd/km
            cp LICENSE README.md "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Render Homebrew formula
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir homebrew
          scripts/homebrew-formula "$VERSION" dist/SHA256SUMS packaging/homebrew/kapellmeister.rb.tmpl > homebrew/kapellmeister.rb
          cat homebrew/kapellmeister.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-formula
          path: homebrew/kapellmeister.rb
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes "${flags[@]}" dist/*
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check credentials
        id: credentials
        env:
          PUBLISHER_APP_CLIENT_ID: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
          PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLISHER_APP_CLIENT_ID:-}" ] || [ -z "${PUBLISHER_APP_PRIVATE_KEY:-}" ]; then
            echo "PUBLISHER_APP_CLIENT_ID or PUBLISHER_APP_PRIVATE_KEY is empty; skipping publishing to the tap"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create App token
        id: app-token
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.credentials.outputs.enabled == 'true'
        with:
          name: homebrew-formula
          path: formula
      - name: Publish formula to the tap
        if: steps.credentials.outputs.enabled == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          header="http.https://github.com/.extraheader=AUTHORIZATION: basic $auth"
          git -c "$header" clone --quiet https://github.com/jystringfellow/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp formula/kapellmeister.rb tap/Formula/kapellmeister.rb
          cd tap
          if [ -z "$(git status --porcelain -- Formula/kapellmeister.rb)" ]; then
            echo "formula unchanged"
            exit 0
          fi
          git add Formula/kapellmeister.rb
          bot="${APP_SLUG}[bot]"
          id=$(gh api "/users/${bot}" --jq .id)
          git -c user.name="$bot" -c user.email="${id}+${bot}@users.noreply.github.com" commit --quiet -m "kapellmeister $TAG"
          git -c "$header" push --quiet origin HEAD
  book:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check credentials
        id: credentials
        env:
          PUBLISHER_APP_CLIENT_ID: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
          PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLISHER_APP_CLIENT_ID:-}" ] || [ -z "${PUBLISHER_APP_PRIVATE_KEY:-}" ]; then
            echo "PUBLISHER_APP_CLIENT_ID or PUBLISHER_APP_PRIVATE_KEY is empty; skipping the book bump"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create App token
        id: app-token
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credentials.outputs.enabled == 'true'
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.credentials.outputs.enabled == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Download and pin release
        id: pin
        if: steps.credentials.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP/release"
          result=$(go run ./scripts/bookpin set book/kits/kapellmeister/kapellmeister.yaml "$TAG" "$RUNNER_TEMP/release/SHA256SUMS")
          echo "$result"
          case "${result%% *}" in
            unchanged|older:) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Open book bump pull request
        if: steps.credentials.outputs.enabled == 'true' && steps.pin.outputs.changed == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="bump/book-km-$TAG"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          header="http.https://github.com/.extraheader=AUTHORIZATION: basic $auth"
          existing=$(git -c "$header" ls-remote --heads origin "refs/heads/$branch")
          if [ -n "$existing" ]; then
            echo "Branch $branch already exists; skipping"
            exit 0
          fi
          bot="${APP_SLUG}[bot]"
          id=$(gh api "/users/${bot}" --jq .id)
          git switch -c "$branch"
          git add book/kits/kapellmeister/kapellmeister.yaml
          git -c user.name="$bot" -c user.email="${id}+${bot}@users.noreply.github.com" commit --quiet -m "Install km $TAG in the kapellmeister book"
          git -c "$header" push --quiet origin "HEAD:refs/heads/$branch"
          body="The checksums come from the release's SHA256SUMS for $TAG. Merging this pull request makes book-tag.yml push the next book/v* tag."
          gh pr create --base main --head "$branch" --title "Install km $TAG in the kapellmeister book" --body "$body"
